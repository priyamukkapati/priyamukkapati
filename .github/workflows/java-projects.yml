name: Java project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [TaskFlow, InventoryLedger, NotifyQueue]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sh projects/java/${{ matrix.project }}/run.sh test
      - run: sh projects/java/${{ matrix.project }}/run.sh demo
